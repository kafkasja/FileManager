name: kfm
description: "Kaf's File Manager: fast, safe, ad-free file and photo manager."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  intl: any
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  photo_manager: ^3.12.0
  riverpod_annotation: ^4.0.7
  sqlite3: ^3.8.0
  video_player: ^2.14.1
  workmanager: ^0.10.10
dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true # l10n codegen (F6 adds l10n.yaml + ARB files)
