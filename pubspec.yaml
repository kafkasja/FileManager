name: kfm
description: "Kaf's File Manager: fast, safe, ad-free file and photo manager."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.5.2
  basic_utils: ^5.8.2
  battery_plus: ^7.1.2
  connectivity_plus: 7.3.1 # 7.3.2 needs dbus 0.8, battery_plus 7 needs 0.7 (C3)
  crypto: ^3.0.7
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  exif: 3.3.0
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image: ^4.12.0
  intl: any
  media_kit: ^1.2.6
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  meta: ^1.19.0
  mobile_scanner: ^7.4.2
  nsd: ^5.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  photo_manager: ^3.12.0
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  sqlite3: ^3.8.0
  tflite_flutter: ^0.12.1
  tray_manager: 0.5.3 # 0.8 pulls the brand-new nativeapi stack (PL1)
  video_player: ^2.14.1
  wakelock_plus: ^1.8.0
  window_manager: ^0.5.2
  workmanager: ^0.10.10
dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # PL1: Windows-only Recycle Bin round trip against the real runner.
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true # l10n codegen (F6 adds l10n.yaml + ARB files)
  assets:
    - assets/search/ # B8: search term files terms_<lang>.json (L2 adds more)
    - assets/ai/ # C3: label map, raw label lists, model manifest (no .tflite)
    - assets/details/ # B10: 'What is this?' table + known app names
    - assets/windows/ # PL1: tray icon (Windows only, 8 KB)

# Windows (tests + PL1 desktop) use the OS's Microsoft-signed winsqlite3.dll:
# Smart App Control blocks the unsigned prebuilt sqlite3.dll (2026-11-02).
# Android/iOS keep the bundled SQLite.
hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
        default: sqlite3
      name_windows: winsqlite3
