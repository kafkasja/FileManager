include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    avoid_dynamic_calls: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
    - test/core/db/generated/**
    - build/**
    - android/**
    - ios/**
    - windows/**

linter:
  rules:
    public_member_api_docs: false # app, not a library
    lines_longer_than_80_chars: false
    # Sync dart:io calls block the calling isolate; on Android shared storage
    # (FUSE) a stat can take milliseconds. Rule 4: never block the UI thread.
    avoid_slow_async_io: false

plugins:
  riverpod_lint: ^3.1.9
